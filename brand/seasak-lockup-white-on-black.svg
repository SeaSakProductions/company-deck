<?xml version="1.0" encoding="UTF-8"?>
<!-- SeaSak Productions — Event Solutions lockup, white on a solid black background.
     For screen printing, convert the text to outlines in Illustrator (Type > Create Outlines). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 320" role="img" aria-label="SeaSak Productions — Event Solutions">
  <rect x="0" y="0" width="1720" height="320" fill="#000000"/>
  <!-- geometric mark -->
  <g transform="translate(28,98) scale(4.6)">
    <g stroke="#ffffff" stroke-width="0.9" fill="none" opacity="0.85">
      <path d="M13 2 L24 13 L13 24 L2 13 Z"/>
      <path d="M13 2 L13 24 M2 13 L24 13"/>
    </g>
    <g fill="#ffffff">
      <circle cx="13" cy="2" r="1.7"/><circle cx="24" cy="13" r="1.7"/>
      <circle cx="13" cy="24" r="1.7"/><circle cx="2" cy="13" r="1.7"/>
      <circle cx="13" cy="13" r="2"/>
    </g>
  </g>
  <!-- wordmark -->
  <text x="186" y="150" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="98" letter-spacing="11">SEASAK PRODUCTIONS</text>
  <line x1="188" y1="182" x2="1700" y2="182" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
  <text x="192" y="238" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-weight="500" font-size="38" letter-spacing="18">EVENT SOLUTIONS</text>
</svg>
