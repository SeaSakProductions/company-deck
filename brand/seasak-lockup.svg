<?xml version="1.0" encoding="UTF-8"?>
<!-- SeaSak Productions — Event Solutions horizontal lockup.
     Color is set by the `fill`/`stroke` = currentColor via the .ink class; change the CSS color
     below to recolor (e.g. #ffffff for dark shirts). For screen printing, convert the text to
     outlines in Illustrator (Type > Create Outlines) so the exact font isn't required. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 320" role="img" aria-label="SeaSak Productions — Event Solutions">
  <style>.ink{color:#000000}</style>
  <g class="ink">
    <!-- geometric mark -->
    <g transform="translate(28,98) scale(4.6)">
      <g stroke="currentColor" stroke-width="0.9" fill="none" opacity="0.85">
        <path d="M13 2 L24 13 L13 24 L2 13 Z"/>
        <path d="M13 2 L13 24 M2 13 L24 13"/>
      </g>
      <g fill="currentColor">
        <circle cx="13" cy="2" r="1.7"/><circle cx="24" cy="13" r="1.7"/>
        <circle cx="13" cy="24" r="1.7"/><circle cx="2" cy="13" r="1.7"/>
        <circle cx="13" cy="13" r="2"/>
      </g>
    </g>
    <!-- wordmark -->
    <text x="186" y="150" fill="currentColor" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="98" letter-spacing="11">SEASAK PRODUCTIONS</text>
    <line x1="188" y1="182" x2="1700" y2="182" stroke="currentColor" stroke-width="2" opacity="0.85"/>
    <text x="192" y="238" fill="currentColor" font-family="Helvetica, Arial, sans-serif" font-weight="500" font-size="38" letter-spacing="18">EVENT SOLUTIONS</text>
  </g>
</svg>
