<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#050608;position:relative;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 85% at 70% 50%,rgba(255,255,255,.11),transparent 60%)}
  .vign{position:absolute;inset:0;background:radial-gradient(ellipse 120% 120% at 50% 50%,transparent 42%,rgba(0,0,0,.6))}
  .right{position:absolute;right:54px;top:0;height:630px;width:480px;display:flex;align-items:center;justify-content:center}
  .left{position:absolute;left:96px;top:50%;transform:translateY(-50%)}
  .name{
    font-weight:800;letter-spacing:.1em;font-size:62px;line-height:1;white-space:nowrap;
    background:linear-gradient(180deg,#ffffff,#d2d9e0 48%,#8b94a1);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .rule{width:330px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.55),transparent);margin:30px 0 24px}
  .tag{font-size:27px;letter-spacing:.44em;text-transform:uppercase;color:#aab2bd;font-weight:500}
  .url{position:absolute;left:98px;bottom:56px;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#6b7280}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="vign"></div>
  <div class="right">
    <svg id="grid" width="470" height="330">
      <defs>
        <filter id="g" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
      </defs>
    </svg>
  </div>
  <div class="left">
    <div class="name">SEASAK&nbsp;PRODUCTIONS</div>
    <div class="rule"></div>
    <div class="tag">Event Solutions</div>
  </div>
  <div class="url">deck.seasakproductions.com</div>

  <script>
    const NS='http://www.w3.org/2000/svg';
    const svg=document.getElementById('grid');
    const W=470,H=330,cx=W/2,cy=H/2,SX=62,SY=35,N=4;
    const pts={};
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      pts[i+','+j]={x:cx+(i-j)*SX, y:cy+((i+j)-(N-1))*SY};
    }
    const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;};
    function line(a,b){mk('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'rgba(205,215,228,0.34)','stroke-width':1.4});}
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      if(i<N-1) line(pts[i+','+j],pts[(i+1)+','+j]);
      if(j<N-1) line(pts[i+','+j],pts[i+','+(j+1)]);
    }
    for(const k in pts){const p=pts[k];
      mk('circle',{cx:p.x,cy:p.y,r:6,fill:'rgba(255,255,255,.9)',filter:'url(#g)'});
      mk('circle',{cx:p.x,cy:p.y,r:3.6,fill:'#ffffff'});
    }
  </script>
</body>
</html>
