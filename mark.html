<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root{ --c:#ffffff; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:800px;height:800px;background:transparent}
  body{display:flex;align-items:center;justify-content:center;color:var(--c)}
  svg{width:540px;height:540px}
</style>
</head>
<body>
  <svg viewBox="0 0 26 26" aria-label="SeaSak mark">
    <g stroke="currentColor" stroke-width="0.9" fill="none" opacity="0.85">
      <path d="M13 2 L24 13 L13 24 L2 13 Z"/>
      <path d="M13 2 L13 24 M2 13 L24 13"/>
    </g>
    <g fill="currentColor">
      <circle cx="13" cy="2" r="1.7"/><circle cx="24" cy="13" r="1.7"/>
      <circle cx="13" cy="24" r="1.7"/><circle cx="2" cy="13" r="1.7"/>
      <circle cx="13" cy="13" r="2"/>
    </g>
  </svg>
  <script>
    const p=new URLSearchParams(location.search);
    if(p.has('black')) document.documentElement.style.setProperty('--c','#000000');
    if(p.has('onblack')){ document.documentElement.style.setProperty('--c','#ffffff'); document.body.style.background='#000000'; }
    if(p.has('onwhite')){ document.documentElement.style.setProperty('--c','#000000'); document.body.style.background='#ffffff'; }
  </script>
</body>
</html>
