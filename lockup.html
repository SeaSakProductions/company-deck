<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root{ --c:#ffffff; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1500px;height:440px;background:transparent}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .lockup{display:flex;align-items:center;gap:42px}
  .lockup svg{flex:none}
  .txt{display:flex;flex-direction:column;justify-content:center}
  .name{font-weight:800;letter-spacing:.12em;font-size:96px;line-height:1;color:var(--c);white-space:nowrap}
  .rule{height:2px;width:100%;background:var(--c);opacity:.85;margin:22px 0 18px}
  .tag{font-size:38px;letter-spacing:.5em;text-transform:uppercase;font-weight:500;color:var(--c);opacity:.9;white-space:nowrap;padding-left:.5em}
</style>
</head>
<body>
  <div class="lockup">
    <svg width="104" height="104" viewBox="0 0 26 26" aria-hidden="true">
      <g stroke="var(--c)" stroke-width="0.9" fill="none" opacity="0.85">
        <path d="M13 2 L24 13 L13 24 L2 13 Z"/>
        <path d="M13 2 L13 24 M2 13 L24 13"/>
      </g>
      <g fill="var(--c)">
        <circle cx="13" cy="2" r="1.7"/><circle cx="24" cy="13" r="1.7"/>
        <circle cx="13" cy="24" r="1.7"/><circle cx="2" cy="13" r="1.7"/>
        <circle cx="13" cy="13" r="2"/>
      </g>
    </svg>
    <div class="txt">
      <div class="name">SEASAK&nbsp;PRODUCTIONS</div>
      <div class="rule"></div>
      <div class="tag">Event Solutions</div>
    </div>
  </div>
  <script>
    const p=new URLSearchParams(location.search);
    if(p.has('black')) document.documentElement.style.setProperty('--c','#000000');
    if(p.has('onblack')){ document.documentElement.style.setProperty('--c','#ffffff'); document.body.style.background='#000000'; }
  </script>
</body>
</html>
